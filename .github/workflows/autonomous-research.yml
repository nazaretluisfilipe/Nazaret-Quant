
name: Nazaret Autonomous Research

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

concurrency:
  group: nazaret-research
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: autonomous/research
          persist-credentials: false
      - name: Ask Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
        run: python automation/autonomous_agent.py propose proposed.json
      - uses: actions/upload-artifact@v4
        with:
          name: proposed
          path: proposed.json
          retention-days: 1

  verify:
    needs: propose
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: autonomous/research
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: proposed
      - run: python automation/autonomous_agent.py apply proposed.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: |
          python -m pytest -q
          git diff --check
      - uses: actions/upload-artifact@v4
        with:
          name: verified
          path: proposed.json
          retention-days: 1

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: autonomous/research
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: verified
      - run: python automation/autonomous_agent.py apply proposed.json
      - name: Commit validated research changes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git add -- src/nazaret_quant tests docs
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "research: autonomous tested improvement"
          AUTH="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/autonomous/research
